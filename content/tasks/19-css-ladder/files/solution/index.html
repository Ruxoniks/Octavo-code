<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Ступеньки на CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="head">
      <p class="head__kicker">Полка над стойкой</p>
      <h1>Расставь ступеньки сам</h1>
      <p class="head__note">Курсор ждёт внизу. Ему нужен путь до кнопки.</p>
    </header>

    <div class="ladder">
      <button class="goal" type="button">Нажми меня</button>

      <div class="step step--1">1</div>
      <div class="step step--2">2</div>
      <div class="step step--3">3</div>
      <div class="step step--4">4</div>
      <div class="step step--5">5</div>
    </div>
  </body>
</html>
