<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Сессия терминала</title>
  </head>
  <body>
    <script id="session" type="application/json">
      {
        "cwd": "/home/user/site",
        "home": "/home/user",
        "fs": {
          "/": { "type": "dir" },
          "/home": { "type": "dir" },
          "/home/user": { "type": "dir" },
          "/home/user/site": { "type": "dir" },
          "/home/user/site/.git": { "type": "dir" },
          "/home/user/site/index.html": { "type": "file", "content": "<!doctype html>" },
          "/home/user/site/README.md": { "type": "file", "content": "# Мой сайт" }
        },
        "git": {
          "initialized": true,
          "branch": "main",
          "staged": [],
          "commits": [{ "message": "Первая версия сайта", "files": ["README.md", "index.html"] }],
          "remote": "https://github.com/user/site.git",
          "pushed": true
        },
        "pasted": { "адрес репозитория": "https://github.com/user/site" },
        "history": [
          "git remote add origin https://github.com/user/site.git",
          "git branch -M main",
          "git push -u origin main",
          "git remote -v"
        ]
      }
    </script>
  </body>
</html>
