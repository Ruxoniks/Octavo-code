<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Карточка товара</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Разметка готова и заперта: в этом задании ты пишешь только CSS. -->
    <article class="card">
      <img class="card__photo" src="cup.svg" alt="Керамическая кружка ручной работы" />

      <div class="card__body">
        <h2 class="card__title">Кружка «Утро»</h2>
        <p class="card__desc">
          Ручная керамика, 350 мл. Толстые стенки держат тепло до конца долгого разговора.
        </p>

        <div class="card__foot">
          <span class="card__price">1 290 ₽</span>
          <button class="card__buy" type="button">В корзину</button>
        </div>
      </div>
    </article>
  </body>
</html>
