<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Цены</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="pricing">
      <h2 class="pricing__title">Сколько это стоит</h2>

      <div class="pricing__grid">
        <article class="plan">
          <h3 class="plan__name">Пробный вечер</h3>
          <p class="plan__price">2 400 ₽</p>
          <p class="plan__note">Три часа, одна чашка, глина и обжиг включены.</p>
        </article>

        <article class="plan plan--featured">
          <h3 class="plan__name">Курс из восьми занятий</h3>
          <p class="plan__price">15 200 ₽</p>
          <p class="plan__note">Восемь недель, набор посуды и своё место в мастерской.</p>
        </article>

        <article class="plan">
          <h3 class="plan__name">Свободная мастерская</h3>
          <p class="plan__price">900 ₽</p>
          <p class="plan__note">Час за кругом для тех, кто уже умеет. Глина отдельно.</p>
        </article>
      </div>
    </section>
  </body>
</html>
