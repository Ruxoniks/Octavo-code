<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Сессия терминала</title>
  </head>
  <body>
    <script id="session" type="application/json">
      {
        "cwd": "/home/user/site",
        "home": "/home/user",
        "fs": {
          "/": { "type": "dir" },
          "/home": { "type": "dir" },
          "/home/user": { "type": "dir" },
          "/home/user/site": { "type": "dir" },
          "/home/user/site/.git": { "type": "dir" },
          "/home/user/site/index.html": { "type": "file", "content": "<!doctype html>" },
          "/home/user/site/README.md": { "type": "file", "content": "# Мой сайт" }
        },
        "git": {
          "initialized": true,
          "branch": "master",
          "staged": [],
          "commits": [{ "message": "Первая версия сайта", "files": ["README.md", "index.html"] }],
          "pushed": false
        },
        "pasted": { "git --version": "git version 2.45.0" },
        "history": ["git init", "git status", "git add .", "git commit -m \"Первая версия сайта\"", "git log"]
      }
    </script>
  </body>
</html>
