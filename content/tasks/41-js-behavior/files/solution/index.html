<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Подробности о кружке</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>Кружка «Утро»</h1>
      <p>Ручная керамика, 350 мл.</p>

      <button id="toggle" type="button">Показать подробности</button>
      <p id="counter">Пока ни разу не нажимал</p>

      <section id="details" hidden>
        <h2>Подробности</h2>
        <ul>
          <li>Обжиг при 1250 °C, посуда переживёт посудомойку</li>
          <li>Толстые стенки держат тепло около часа</li>
          <li>Каждая кружка немного своей формы — это ручная работа</li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
