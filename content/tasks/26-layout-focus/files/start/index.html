<!doctype html>
<html lang="ru">
  <head>

    <title>Что вы унесёте домой</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="pitch">
      <img class="pitch__media" src="cup.svg" alt="Готовая чашка с неровным краем" />

      <div class="pitch__text">
        <h2 class="pitch__title">Домой вы унесёте свою чашку</h2>
        <p class="pitch__lead">
          Не сувенир из магазина при студии, а вещь, которую вы сделали руками от кома глины
          до готового края.
        </p>
        <p class="pitch__note">Обжиг занимает две недели. Мы напишем, когда можно забирать.</p>
      </div>
    </section>
  </body>
