<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Кофейня «Ленивый курсор»</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="hero">
      <img class="hero__mark" src="beans.svg" alt="Чашка кофе с паром" />

      <div>
        <p class="hero__kicker">Садовая, 14 — вход со двора</p>
        <h1>Кофейня «Ленивый курсор»</h1>
        <p class="hero__hours">Открыто с 8:00 до 22:00, без выходных</p>
      </div>
    </div>

    <main>
      <p class="lead">Чем мы гордимся:</p>

      <p class="tags">
        <span class="tag">своя обжарка</span>
        <span class="tag">завтраки весь день</span>
        <span class="tag">можно с собакой</span>
      </p>
    </main>
  </body>
</html>
