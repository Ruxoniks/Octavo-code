<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Меню — кофейня «Ленивый курсор»</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="head">
      <p class="head__kicker">Кофейня «Ленивый курсор»</p>
      <h1>Меню на сегодня</h1>
      <p class="head__note">Зерно обжарили в понедельник, молоко фермерское.</p>
    </header>

    <main class="menu">
      <div class="card">
        <div class="card__row">
          <h2>Раф на кокосовом</h2>
          <span class="card__price">280 ₽</span>
        </div>
        <p>Сладкий, тёплый, с ванилью.</p>
      </div>

      <div class="card">
        <div class="card__row">
          <h2>Фильтр дня</h2>
          <span class="card__price">190 ₽</span>
        </div>
        <p>Каждый день новое зерно — спросите, какое сегодня.</p>
      </div>

      <div class="card">
        <div class="card__row">
          <h2>Какао</h2>
          <span class="card__price">220 ₽</span>
        </div>
        <p>Густое, с маршмеллоу и щепоткой соли.</p>
      </div>
    </main>
  </body>
</html>
