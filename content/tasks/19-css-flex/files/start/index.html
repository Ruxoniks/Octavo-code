<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Завтраки — кофейня «Ленивый курсор»</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="head">
      <p class="head__kicker">Кофейня «Ленивый курсор»</p>
      <h1>Завтраки до полудня</h1>
      <p class="head__note">Каждый подают с фильтр-кофе или чаем.</p>
    </header>

    <div class="row">
      <div class="card">
        <h2>Сырники</h2>
        <p>С густой сметаной и вишнёвым вареньем</p>
        <span class="card__price">340 ₽</span>
      </div>
      <div class="card">
        <h2>Овсянка</h2>
        <p>С грушей, корицей и жареным фундуком</p>
        <span class="card__price">290 ₽</span>
      </div>
      <div class="card">
        <h2>Омлет</h2>
        <p>С зеленью, сыром и хлебом на закваске</p>
        <span class="card__price">360 ₽</span>
      </div>
    </div>
  </body>
</html>
