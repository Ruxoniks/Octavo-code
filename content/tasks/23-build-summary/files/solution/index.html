      <h1>Мастерская «Полка»</h1>

        <p id="seats">Свободных мест: 4</p>

        <p>Садовая, 14, вход со двора. Открыто с 11 до 20.</p>
      </section>

    <footer class="block">
      <p>© 2026 Мастерская «Полка»</p>
